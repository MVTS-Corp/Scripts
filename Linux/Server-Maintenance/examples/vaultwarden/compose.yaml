# /opt/Vaultwarden/compose.yaml
# The tag is pinned literally on the image line (not through ${VW_VERSION}
# in .env) so server-maintenance can manage it without reading .env.
# Public access only through a cloudflared tunnel on the "web" network; the
# localhost port is for the admin panel over an SSH tunnel and for the
# health check (IMAGE_vaultwarden_HEALTH="http:http://127.0.0.1:8081/alive").
services:
  vaultwarden:
    image: vaultwarden/server:1.34.3
    container_name: vaultwarden
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8081:80"
    networks: [web]
    mem_limit: 256m

networks:
  web:
    external: true

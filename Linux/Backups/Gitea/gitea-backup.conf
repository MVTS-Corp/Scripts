# gitea-backup.conf
# 2026-08-11
# Version: v4.0.2
#
# CHANGELOG:
#   v4.0.2 - GITEA_CONTAINER_TMP default moved from /data/gitea-dump-tmp
#            to /data/gitea/gitea-dump-tmp - found via a live deployment
#            against the official gitea/gitea image, where /data itself
#            is root-owned 755 (not writable by the git user) while
#            /data/gitea is git-owned. The old default failed "gitea
#            dump" at the first mkdir on every deployment matching that
#            (apparently standard) layout, not just this one.
#   v4.0.1 - Default paths for NAS_SSH_KEY, NAS_KNOWN_HOSTS, and
#            RSYNC_DAEMON_PASSWORD_FILE moved from /etc/gitea-backup to
#            /opt/gitea-backup, matching the scripts' new default config
#            location (gitea-backup.sh v4.0.2) - everything for this tool
#            now lives in one directory by default instead of split
#            across two. Still just suggested defaults - any path works,
#            see README.md's Configuration Reference.
#
# PURPOSE:
# Site-specific configuration shared by gitea-backup.sh and
# gitea-restore.sh. Copy this file to /opt/gitea-backup/gitea-backup.conf
# and fill in real values for this host. This file is sourced by both
# scripts; do not put anything here that isn't a plain KEY=value
# assignment.

# --- Container identity ---
# Name (not ID) of the running Gitea container, e.g. "gitea"
GITEA_CONTAINER_NAME=""

# User the Gitea process runs as inside the container. The official Gitea
# image runs as "git" - "gitea dump" must be run as this user or it cannot
# read its own data.
GITEA_CONTAINER_USER="git"

# Path to app.ini INSIDE the container
GITEA_APP_INI="/data/gitea/conf/app.ini"

# Scratch path INSIDE the container where the dump is written before
# docker cp pulls it out. Must be writable by GITEA_CONTAINER_USER. Placed
# under /data/gitea (not directly under /data) because on the official
# gitea/gitea image, /data itself is commonly root-owned 755 - writable
# only by root, not by the git user - while /data/gitea (Gitea's own app
# data directory, alongside GITEA_APP_INI) is git-owned and guaranteed
# writable. Confirm this against your own container if unsure:
# "docker exec <container> ls -la /data".
GITEA_CONTAINER_TMP="/data/gitea/gitea-dump-tmp"

# Filesystem path INSIDE the container where Gitea stores repositories
# (the "[repository] ROOT" setting in app.ini). Only used by
# gitea-restore.sh. Confirm this against the real container - either read
# ROOT from the live app.ini, or if it is unset there, Gitea's own default
# is "%(APP_DATA_PATH)s/gitea-repositories" (i.e. under GITEA_APP_INI's
# data dir); older docker-image layouts commonly used "/data/git/
# repositories" instead. Do not guess - confirm it, the same way
# NAS_REMOTE_PATH below must be confirmed rather than assumed.
GITEA_REPO_ROOT=""

# Bounds the "gitea dump" step itself (docker exec + docker cp), so a
# stuck dump (locked DB, full disk) fails loudly instead of hanging the
# job forever with no notification. Raise this if a large instance
# legitimately needs longer. Seconds.
DUMP_TIMEOUT=21600

# --- Local staging (fast local disk on the Docker host, not the NAS) ---
STAGING_DIR="/var/backups/gitea-staging"
STAGING_RETENTION_DAYS=3

# =============================================================================
# NAS transport
# =============================================================================
# TRANSFER_METHOD selects how both scripts talk to the NAS. Everything in
# this section down to "Retention on the NAS" is shared by every method;
# each method then has its own subsection below - fill in only the one
# matching TRANSFER_METHOD, the others are ignored.
#
#   sftp          (default) Works over SSH but needs no remote command
#                 execution capability, so it works on accounts that are
#                 restricted to SFTP-only access - the common case on NAS
#                 platforms (Synology DSM confirmed) that reserve full
#                 interactive/command SSH access for administrators. See
#                 README.md "Transport" for the full reasoning.
#   rsync-ssh     Full rsync over SSH. Needs an account with real SSH
#                 command-execution access - use this where that access is
#                 actually available (many non-NAS Linux SSH targets, or a
#                 NAS without the admin-only SSH restriction above).
#   rsync-daemon  The NAS's native rsync service (no SSH at all - a
#                 separate daemon-specific username/password). Transmits
#                 file contents unencrypted unless separately tunneled -
#                 only use this where that is an accepted tradeoff (e.g.
#                 staying entirely on a trusted internal network).
TRANSFER_METHOD="sftp"

# Hostname or IP of the NAS. No default - every deployment points at a
# different NAS; confirm this rather than guessing. Used by every
# TRANSFER_METHOD (the "SSH" in the variable name is historical from when
# this was the only transport - it names the NAS itself, not a specific
# protocol).
NAS_SSH_HOST=""

# Filesystem path on the NAS, NOT the SMB share name. An SMB path like
# \\nas-host\backups\Gitea is a share-level view; the real transport needs
# the underlying filesystem path (commonly something like
# /volume1/backups/Gitea on Synology, or /mnt/<pool>/backups/Gitea on
# TrueNAS). CONFIRM this by SSHing into the NAS before first use - see
# README.md "Confirm the Remote Path" section. Do not guess. No default -
# every deployment's path is different. For TRANSFER_METHOD=rsync-daemon
# this means something different: a path INSIDE the module named by
# RSYNC_DAEMON_MODULE below, NOT a filesystem path, and it must NOT start
# with "/" (leave it blank to use the module's root) - the script will
# refuse to start rather than send a malformed URL if this is left as an
# absolute path from a previous sftp/rsync-ssh setup.
NAS_REMOTE_PATH=""

# Per-attempt transfer stall timeout (seconds) and bounded retry count,
# used by every TRANSFER_METHOD. Each retry re-transfers the whole file -
# only rsync-ssh's --partial gives real mid-transfer resume; sftp and
# rsync-daemon here do not.
TRANSFER_TIMEOUT=120
MAX_TRANSFER_ATTEMPTS=3

# Optional. Set to "yes" to independently verify each backup transfer by
# re-fetching the file from the NAS and comparing checksums locally. Off
# by default because it doubles the transfer (a full re-download every
# run) - this is the only verification method that works identically
# across every TRANSFER_METHOD, since not all of them can run a remote
# checksum command. Worth enabling for infrequent/critical backups,
# probably not for large or frequent ones.
VERIFY_TRANSFER=""

# --- sftp / rsync-ssh: SSH connection details (ignored for rsync-daemon) ---
NAS_SSH_PORT="22"

# Dedicated, low-privilege account on the NAS used only for this backup.
# Do NOT use an admin account here. See README.md for how to scope this
# account to write access on the Gitea backup folder only. SFTP-only
# access does not require this account to have interactive shell access -
# on platforms that restrict full SSH login to administrators (Synology
# DSM is a known case), SFTP still works for a normal, permission-scoped
# account; rsync-ssh needs real SSH command-execution access instead.
NAS_SSH_USER="gitea-backup"

# Dedicated key pair for this job (not a personal or shared key).
# Private key must be mode 600, owned by the account running this script.
NAS_SSH_KEY="/opt/gitea-backup/id_ed25519_gitea-backup"

# Pre-seeded known_hosts file scoped to just this NAS (see README.md).
# Using a dedicated file rather than the system-wide known_hosts keeps this
# job's host-key trust independent and easy to audit or rotate.
NAS_KNOWN_HOSTS="/opt/gitea-backup/known_hosts"

# --- rsync-ssh only: NAS platforms that don't put rsync on the SSH
# session's PATH (ignored for sftp and rsync-daemon) ---
# Optional. Full path to the rsync binary ON THE NAS. Leave blank for a
# normal Linux SSH target - rsync is found on PATH automatically. Some NAS
# platforms (e.g. Synology DSM) don't put rsync on the PATH an SSH session
# gets, which makes rsync-over-SSH authenticate fine but then fail with
# "Permission denied" on the actual transfer, unless the remote binary's
# full path is given explicitly via rsync's own --rsync-path option. If
# you hit that error, try "/usr/bin/rsync" (Synology's usual location)
# here first.
RSYNC_REMOTE_BIN=""

# --- rsync-daemon only (ignored for sftp and rsync-ssh) ---
# Daemon-specific username, separate from any NAS login account - this is
# whatever account you created in the NAS's own rsync service management
# (on Synology: Control Panel > File Services > rsync > Rsync Account).
RSYNC_DAEMON_USER=""

# Path to a file containing ONLY that account's password (no key=value
# wrapping, no trailing content besides the password itself, mode 600).
# Never put the password directly in this .conf file - keep it in its own
# tightly-permissioned file instead, matching the same reasoning as
# NAS_SSH_KEY above (a secret lives in its own file with its own explicit
# permissions, not inline in a config file that might get copied around or
# accidentally left more permissive than intended).
RSYNC_DAEMON_PASSWORD_FILE="/opt/gitea-backup/rsync_daemon_password"

# The module name configured in the NAS's rsync service - not a filesystem
# path. Each module maps to one directory on the NAS side; NAS_REMOTE_PATH
# above (if set) is a subpath within this module, not a separate location.
RSYNC_DAEMON_MODULE=""

# Optional. Port the NAS's rsync daemon listens on. 873 is the standard
# default; only change this if the NAS was configured to use a different
# port.
RSYNC_DAEMON_PORT="873"

# --- Retention on the NAS ---
RETENTION_DAYS=30

# --- Minimum sanity threshold ---
# A dump smaller than this (bytes) is treated as suspicious and fails the
# run rather than being shipped to the NAS. Adjust to roughly half your
# smallest known-good dump size.
MIN_DUMP_SIZE_BYTES=1048576

# --- Restore (gitea-restore.sh only) ---
# Local staging for fetched/extracted archives during a restore. Kept
# separate from STAGING_DIR's retention sweep (which only matches
# gitea-dump-*.zip in STAGING_DIR itself) so a restore in progress can
# never be swept up by a concurrent backup run's cleanup.
RESTORE_STAGING_DIR="/var/backups/gitea-staging/restore"

# Bounds each disruptive restore step (stop/start, docker cp, extraction).
# Seconds.
RESTORE_TIMEOUT=21600

# Optional. A shell command that imports gitea-db.sql into your actual
# database engine, used only by "gitea-restore.sh --restore" (the real,
# production restore). The extracted SQL dump's path is passed to it via
# the RESTORE_SQL_HOST_PATH environment variable. Left blank on purpose:
# this project does not manage DB engine or credentials (gitea dump uses
# Gitea's own DB connection internally and never needed them either), so
# guessing here risks running the wrong command against a real database.
# Example (external MySQL container reachable from this host):
#   DB_RESTORE_CMD='docker exec -i gitea-mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" gitea < "$RESTORE_SQL_HOST_PATH"'
# If left blank, --restore still restores repositories and app data, then
# stops and logs exactly where gitea-db.sql is for a manual import.
DB_RESTORE_CMD=""

# Optional, and deliberately SEPARATE from DB_RESTORE_CMD. Used only by
# "gitea-restore.sh --test-restore", which always runs against an
# isolated, throwaway container/volume/network - never production's.
# Do NOT set this to the same value as DB_RESTORE_CMD: that command is
# written to reach your real database, and test-restore runs are meant to
# be safe to fire at any time, including on a schedule, without any risk
# to production. Point this at a non-production test database instead if
# you want test-restore to validate the DB import step too; leave it
# blank to have test-restore validate everything except that step (see
# gitea-restore.sh header for exactly what that does and does not prove).
TEST_RESTORE_DB_CMD=""

# Container name prefix, published host port for the throwaway Gitea web
# UI, and the volume mount point used for "--test-restore". Defaults
# assume the standard gitea/gitea image convention of a single /data
# volume - adjust RESTORE_TEST_DATA_MOUNT if this deployment differs.
RESTORE_TEST_CONTAINER_PREFIX="gitea-test-restore"
RESTORE_TEST_PORT=3080
RESTORE_TEST_DATA_MOUNT="/data"

# Optional. Overrides which image "--test-restore" uses; if blank, it
# reuses whatever image GITEA_CONTAINER_NAME is currently running, so a
# routine test-restore always matches production's actual version.
RESTORE_TEST_IMAGE=""

# How long (seconds) to wait after starting a restored container before
# checking whether it is still running (the authoritative health signal -
# see gitea-restore.sh).
RESTORE_TEST_HEALTH_GRACE_SECONDS=60

# --- Notifications ---
NOTIFY_EMAIL=""
MAIL_FROM=""

# Optional: Uptime Kuma push monitor URL. Leave blank to disable heartbeat.
# Ping is sent only after a verified-good backup, so a crashed/never-run
# job shows up as a missed heartbeat in Kuma rather than no signal at all.
HEARTBEAT_URL=""

# --- Logging ---
LOG_FILE="/var/log/gitea-backup.log"
